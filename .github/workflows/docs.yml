name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-24.04 already ships Swift, but the Ubuntu-supplied toolchain
      # does not include the swift-docc *render artifacts* (CSS + JS) that
      # DocC needs to produce a working static site. Generating documentation
      # against the image-supplied Swift yields HTML that references
      # `/css/...` and `/js/...` URLs that 404, so the page renders blank.
      # The setup-swift bundle includes the render artifacts.
      - name: Install Swift toolchain (for DocC render assets)
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      # apt-get update first: the runner image ships a package index that is
      # often older than the mirrors, and installing against it 404s.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      # The same script that builds the site locally. It compiles the
      # snippets, builds with the hosting base path, and writes the redirect
      # the site root needs. See .agents/skills/building-docs/SKILL.md.
      - name: Build DocC archive
        run: .agents/skills/building-docs/scripts/docs.sh build --hosted

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
